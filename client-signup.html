<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Activer mon espace client — TailorFlow</title>
  <meta name="description" content="TailorFlow — la gestion d'atelier de couture : clients, mesures, commandes, facturation." />
  <meta name="theme-color" content="#234867" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.2"></script>
</head>
<body>
  <main class="login-page">
    <div class="login-card">
      <div class="auth-brand"><img src="favicon.svg" alt="" width="36" height="36" /> TailorFlow</div>
      <h1>Mon espace client</h1>
      <p class="subtitle">Active ton accès avec le code reçu de ton couturier pour suivre tes commandes et tes mesures.</p>

      <form id="client-signup-form">
        <div class="form-group">
          <label for="invite_code">Code d'invitation</label>
          <input type="text" id="invite_code" name="invite_code" required maxlength="12" class="input-uppercase" placeholder="Reçu de ton couturier" autocomplete="off" />
        </div>
        <div class="form-group">
          <label for="full_name">Nom complet</label>
          <input type="text" id="full_name" name="full_name" required maxlength="150" autocomplete="name" />
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required autocomplete="username" inputmode="email" />
        </div>
        <div class="form-group">
          <label for="password">Mot de passe (8 caractères minimum)</label>
          <input type="password" id="password" name="password" required minlength="8" autocomplete="new-password" />
        </div>
        <button type="submit" id="submit-btn" class="btn btn-primary btn-block">Activer mon espace</button>
        <p class="error-message" id="error-message" role="alert"></p>
      </form>
      <p class="auth-footer">Déjà un compte ? <a class="link-plain" href="client-activate.html">Ajouter ce code à mon compte</a></p>
    </div>
  </main>

  <script type="module" src="js/clientSignupPage.js"></script>
</body>
</html>
