<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mon catalogue — TailorFlow</title>
  <meta name="theme-color" content="#234867" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.2"></script>
</head>
<body>
  <div class="app-shell">
    <nav class="app-nav" id="app-nav" aria-label="Navigation principale"></nav>

    <main class="app-main">
      <div class="page-header">
        <div>
          <h1>Mon catalogue</h1>
          <p class="text-muted">Les articles visibles apparaissent dans la marketplace. Tes clients rattachés peuvent les commander à distance avec leurs mesures enregistrées chez toi.</p>
          <p class="text-muted text-sm" id="catalog-count"></p>
        </div>
        <div class="page-header-actions">
          <a class="btn btn-secondary" href="marketplace.html">Voir la marketplace</a>
          <button class="btn btn-primary" id="new-item-btn" type="button">+ Nouvel article</button>
        </div>
      </div>

      <div class="catalog-grid" id="catalog-items-grid"></div>
    </main>
  </div>

  <!-- Modale : article -->
  <div class="modal-backdrop" id="item-modal" role="dialog" aria-modal="true" aria-labelledby="item-modal-title" aria-hidden="true">
    <div class="modal-box">
      <div class="modal-header">
        <h2 id="item-modal-title">Nouvel article</h2>
        <button class="modal-close" id="close-item-modal" type="button" aria-label="Fermer">&times;</button>
      </div>
      <form id="item-form">
        <div class="form-group">
          <label for="item-photo">Photo</label>
          <div class="photo-upload">
            <img id="item-photo-preview" class="catalog-photo-upload-preview" alt="Aperçu de la photo" hidden />
            <button type="button" class="btn btn-ghost btn-sm" id="remove-photo-btn" hidden>Retirer la photo</button>
          </div>
          <input type="file" id="item-photo" accept="image/jpeg,image/png,image/webp" />
          <p class="field-hint">JPG, PNG ou WebP. Les grandes photos sont automatiquement réduites.</p>
        </div>
        <div class="form-group">
          <label for="item-name">Nom de l'article *</label>
          <input type="text" id="item-name" name="name" required maxlength="150" placeholder="Ex : Boubou brodé homme" />
        </div>
        <div class="form-group">
          <label for="item-description">Description</label>
          <textarea id="item-description" name="description" rows="3" maxlength="600" placeholder="Tissu, finitions, délai habituel..."></textarea>
        </div>
        <div class="form-group">
          <label for="item-price">Prix (FCFA) *</label>
          <input type="number" id="item-price" name="price" min="0" step="1" inputmode="numeric" required />
        </div>
        <label class="checkbox-label">
          <input type="checkbox" id="item-active" name="is_active" checked />
          Visible dans la marketplace
        </label>
        <p class="error-message" id="item-form-error" role="alert"></p>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" id="cancel-item-form">Annuler</button>
          <button type="submit" class="btn btn-primary" id="item-submit-btn">Enregistrer</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="js/catalogManage.js"></script>
</body>
</html>
