<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mon catalogue — TailorFlow</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="app-shell">
    <nav class="app-nav" id="app-nav"></nav>

    <main class="app-main">
      <h1>Mon catalogue</h1>
      <p style="color:var(--color-text-muted);">
        Les articles actifs de ton catalogue sont visibles par tes clients dans la marketplace,
        qui peuvent commander directement à distance s'ils ont déjà une fiche de mesure chez toi.
      </p>

      <div class="toolbar">
        <div class="spacer"></div>
        <button class="btn btn-primary" id="new-item-btn">+ Nouvel article</button>
      </div>

      <div class="catalog-grid" id="catalog-items-grid"></div>
    </main>
  </div>

  <!-- Modale : nouvel article / édition -->
  <div class="modal-backdrop" id="item-modal">
    <div class="modal-box">
      <div class="modal-header">
        <h2 id="item-modal-title">Nouvel article</h2>
        <button class="modal-close" id="close-item-modal">&times;</button>
      </div>
      <form id="item-form">
        <div class="form-group">
          <label for="item-photo">Photo</label>
          <img id="item-photo-preview" class="catalog-photo-upload-preview" style="display:none;" />
          <input type="file" id="item-photo" accept="image/*" />
          <p class="field-hint">Formats acceptés : JPG, PNG. 5 Mo maximum.</p>
        </div>
        <div class="form-group">
          <label for="item-name">Nom de l'article *</label>
          <input type="text" id="item-name" name="name" required placeholder="Ex : Boubou brodé homme" />
        </div>
        <div class="form-group">
          <label for="item-description">Description</label>
          <textarea id="item-description" name="description" rows="3"></textarea>
        </div>
        <div class="form-group">
          <label for="item-price">Prix (FCFA) *</label>
          <input type="number" id="item-price" name="price" min="0" step="100" required />
        </div>
        <div class="form-group">
          <label style="display:flex; align-items:center; gap:8px; font-weight:400;">
            <input type="checkbox" id="item-active" name="is_active" checked style="width:auto;" />
            Visible dans la marketplace
          </label>
        </div>
        <p class="error-message" id="item-form-error"></p>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" id="cancel-item-form">Annuler</button>
          <button type="submit" class="btn btn-primary" id="item-submit-btn">Enregistrer</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="js/catalogManage.js"></script>
</body>
</html>
