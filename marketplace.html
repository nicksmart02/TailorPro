<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Marketplace — TailorFlow</title>
  <meta name="theme-color" content="#234867" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.2"></script>
</head>
<body>
  <div class="app-shell">
    <nav class="app-nav" id="app-nav" aria-label="Navigation principale"></nav>

    <main class="app-main">
      <div class="page-header">
        <div>
          <h1>Découvrir des couturiers</h1>
          <p class="text-muted" id="marketplace-intro"></p>
        </div>
      </div>

      <div class="toolbar">
        <input type="search" id="search-input" class="toolbar-search" placeholder="Rechercher un atelier, un modèle, un quartier..." aria-label="Rechercher dans la marketplace" />
      </div>

      <div id="marketplace-container"><p class="text-muted">Chargement...</p></div>
    </main>
  </div>

  <!-- Modale : commande à distance -->
  <div class="modal-backdrop" id="order-modal" role="dialog" aria-modal="true" aria-labelledby="order-modal-title" aria-hidden="true">
    <div class="modal-box">
      <div class="modal-header">
        <h2 id="order-modal-title">Commander</h2>
        <button class="modal-close" id="close-order-modal" type="button" aria-label="Fermer">&times;</button>
      </div>
      <form id="remote-order-form">
        <div id="order-item-summary" class="order-summary-box"></div>

        <div class="form-group">
          <label for="order-measurement">Fiche de mesure à utiliser *</label>
          <select id="order-measurement" name="measurement_id" required></select>
          <p class="field-hint">Ce sont les mesures prises par l'atelier lors de ta dernière visite.</p>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="order-quantity">Quantité</label>
            <input type="number" id="order-quantity" name="quantity" min="1" max="50" step="1" value="1" />
          </div>
          <div class="form-group">
            <label for="order-due-date">Date de remise souhaitée *</label>
            <input type="date" id="order-due-date" name="due_date" required />
          </div>
        </div>

        <div class="form-group">
          <label for="order-notes">Précisions (tissu, couleur...)</label>
          <input type="text" id="order-notes" name="notes" maxlength="100" placeholder="Ex : wax bleu, manches courtes" />
        </div>

        <p class="total-preview" id="order-total-preview" aria-live="polite"></p>
        <p class="error-message" id="order-form-error" role="alert"></p>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" id="cancel-order-form">Annuler</button>
          <button type="submit" class="btn btn-primary">Envoyer la commande</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="js/marketplace.js"></script>
</body>
</html>
