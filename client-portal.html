<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mon espace — TailorFlow</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="app-shell">
    <nav class="app-nav" id="app-nav">
      <div class="nav-brand" id="portal-brand">TailorFlow</div>
      <div style="display:flex; gap:8px; align-items:center; margin-left:auto; flex-wrap:wrap;">
        <a class="btn btn-secondary" href="marketplace.html">🛍️ Découvrir des couturiers</a>
        <button class="btn btn-secondary" id="relink-btn">🔎 Rechercher mes couturiers</button>
        <button class="btn btn-secondary" id="logout-btn">Se déconnecter</button>
      </div>
    </nav>

    <main class="app-main">
      <h1 id="welcome-title">Bonjour</h1>
      <p style="color:var(--color-text-muted);">Retrouve ici tes commandes chez chacun de tes couturiers.</p>

      <p class="error-message" id="portal-message" style="color:var(--color-success);"></p>

      <div id="establishments-container"></div>
    </main>
  </div>

  <script type="module" src="js/clientPortal.js"></script>
</body>
</html>
