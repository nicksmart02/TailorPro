<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Finaliser mon espace client — TailorFlow</title>
  <meta name="description" content="TailorFlow — la gestion d'atelier de couture : clients, mesures, commandes, facturation." />
  <meta name="theme-color" content="#234867" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.2"></script>
</head>
<body>
  <main class="login-page">
    <div class="login-card">
      <div class="auth-brand"><img src="favicon.svg" alt="" width="36" height="36" /> TailorFlow</div>
      <h1>Finaliser mon espace client</h1>
      <p class="subtitle">Connecte-toi et valide ton code d'invitation pour rattacher ton atelier.</p>

      <form id="activate-form">
        <div id="credentials-fields">
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required autocomplete="username" inputmode="email" />
          </div>
          <div class="form-group">
            <label for="password">Mot de passe</label>
            <input type="password" id="password" name="password" required autocomplete="current-password" />
          </div>
        </div>
        <div class="form-group">
          <label for="invite_code">Code d'invitation</label>
          <input type="text" id="invite_code" name="invite_code" maxlength="12" class="input-uppercase" autocomplete="off" />
        </div>
        <button type="submit" id="submit-btn" class="btn btn-primary btn-block">Activer mon espace</button>
        <p class="error-message" id="error-message" role="alert"></p>
      </form>
      <p class="auth-footer"><a class="link-plain" href="login.html">&larr; Retour à la connexion</a></p>
    </div>
  </main>

  <script type="module" src="js/clientActivatePage.js"></script>
</body>
</html>
