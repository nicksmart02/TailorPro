<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bienvenue — TailorFlow</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="login-page">
    <div class="login-card" style="max-width:480px;">
      <h1>Bienvenue sur TailorFlow</h1>
      <p class="subtitle">Dis-nous qui tu es pour configurer ton espace.</p>

      <div id="role-choice">
        <button type="button" class="role-choice-card" id="choose-couturier">
          <span class="role-choice-icon">✂️</span>
          <span>
            <strong>Je suis couturier</strong>
            <span class="role-choice-desc">Je gère un atelier : clients, mesures, commandes, facturation.</span>
          </span>
        </button>
        <button type="button" class="role-choice-card" id="choose-client">
          <span class="role-choice-icon">🧵</span>
          <span>
            <strong>Je suis client</strong>
            <span class="role-choice-desc">Je veux suivre mes commandes et commander à distance chez mes couturiers.</span>
          </span>
        </button>
      </div>

      <!-- Formulaire client (nom + téléphone), affiché après le choix "Je suis client" -->
      <form id="client-form" style="display:none;">
        <p style="font-size:0.85rem; color:var(--color-text-muted); margin-bottom:16px;">
          Indique le même numéro de téléphone que celui donné à tes couturiers :
          on recherchera automatiquement tes commandes existantes.
        </p>
        <div class="form-group">
          <label for="client-full-name">Nom complet</label>
          <input type="text" id="client-full-name" name="full_name" required />
        </div>
        <div class="form-group">
          <label for="client-phone">Numéro de téléphone</label>
          <input type="tel" id="client-phone" name="phone" required placeholder="Ex : 90000000" />
        </div>
        <p class="error-message" id="client-form-error"></p>
        <button type="submit" id="client-submit-btn" class="btn btn-primary" style="width:100%">Continuer</button>
        <button type="button" class="btn btn-secondary" id="client-form-back" style="width:100%; margin-top:8px;">Retour</button>
      </form>

      <p class="error-message" id="role-error"></p>
    </div>
  </div>

  <script type="module" src="js/chooseRole.js"></script>
</body>
</html>
