<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Détail facture — TailorFlow</title>
  <meta name="theme-color" content="#234867" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.2"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
</head>
<body>
  <div class="app-shell">
    <nav class="app-nav no-print" id="app-nav" aria-label="Navigation principale"></nav>

    <main class="app-main">
      <p class="no-print"><a class="link-plain" href="invoices.html">&larr; Retour aux factures</a></p>

      <div class="page-header no-print">
        <div>
          <h1 id="invoice-title">—</h1>
          <div id="invoice-status-badge"></div>
        </div>
        <div class="page-header-actions">
          <button class="btn btn-primary" id="new-payment-btn" type="button">+ Enregistrer un paiement</button>
        </div>
      </div>

      <div class="card no-print">
        <dl class="kv-list" id="invoice-info"></dl>
      </div>

      <div class="card no-print">
        <h2 class="card-title">Reçu</h2>
        <div class="button-row">
          <button class="btn btn-secondary" id="download-receipt-btn" type="button">⭳ Télécharger le reçu (PNG)</button>
          <button class="btn btn-secondary" id="print-invoice-btn" type="button">🖶 Imprimer / PDF</button>
          <a class="btn btn-secondary" id="whatsapp-invoice-btn" href="#" target="_blank" rel="noopener" style="display:none;">💬 Envoyer au client</a>
        </div>
      </div>

      <!-- Gabarit imprimable : identique au reçu PNG, visible uniquement à l'impression / export PDF -->
      <div class="print-only receipt-print-box" id="print-receipt"></div>

      <div class="card card-flush no-print">
        <div class="card-flush-header">
          <h2>Historique des paiements</h2>
        </div>
        <table class="data-table">
          <thead><tr><th>Date</th><th>Montant</th><th>Moyen de paiement</th><th></th></tr></thead>
          <tbody id="payments-table-body"></tbody>
        </table>
      </div>
    </main>
  </div>

  <!-- Modale : nouveau paiement -->
  <div class="modal-backdrop" id="payment-modal" role="dialog" aria-modal="true" aria-labelledby="payment-modal-title" aria-hidden="true">
    <div class="modal-box">
      <div class="modal-header">
        <h2 id="payment-modal-title">Enregistrer un paiement</h2>
        <button class="modal-close" id="close-payment-modal" type="button" aria-label="Fermer">&times;</button>
      </div>
      <form id="payment-form">
        <div class="form-group">
          <label for="payment-amount">Montant (FCFA) *</label>
          <div class="input-with-button">
            <input type="number" id="payment-amount" name="amount" min="1" step="1" inputmode="numeric" required />
            <button type="button" class="btn btn-secondary" id="pay-full-btn">Tout le solde</button>
          </div>
          <p class="field-hint" id="remaining-balance-hint"></p>
        </div>
        <div class="form-group">
          <label for="payment-method">Moyen de paiement *</label>
          <select id="payment-method" name="payment_method" required>
            <option value="cash">Espèces</option>
            <option value="mobile_money">Mobile Money</option>
            <option value="bank_transfer">Virement bancaire</option>
            <option value="card">Carte</option>
          </select>
        </div>
        <p class="error-message" id="payment-form-error" role="alert"></p>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" id="cancel-payment-form">Annuler</button>
          <button type="submit" class="btn btn-primary">Enregistrer</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="js/invoiceDetail.js"></script>
</body>
</html>
