<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Facturation — TailorFlow</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="app-shell">
    <nav class="app-nav" id="app-nav"></nav>

    <main class="app-main">
      <h1>Facturation</h1>

      <div class="toolbar">
        <select id="status-filter">
          <option value="">Tous les statuts</option>
          <option value="unpaid">Impayée</option>
          <option value="partial">Partiellement payée</option>
          <option value="paid">Payée</option>
        </select>
        <input type="text" id="search-input" placeholder="Rechercher par n° facture ou client..." style="min-width:260px;" />
      </div>

      <div class="card" style="padding:0;">
        <div class="table-scroll">
        <table class="data-table">
          <thead>
            <tr>
              <th>N° facture</th>
              <th>Client</th>
              <th>Commande</th>
              <th>Émise le</th>
              <th>Total</th>
              <th>Payé</th>
              <th>Statut</th>
            </tr>
          </thead>
          <tbody id="invoices-table-body"></tbody>
        </table>
        </div>
      </div>
    </main>
  </div>

  <script type="module" src="js/invoices.js"></script>
</body>
</html>
