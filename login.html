<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connexion — TailorFlow</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <h1>TailorFlow</h1>
      <p class="subtitle">Connectez-vous pour accéder à votre atelier</p>

      <form id="login-form">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required autocomplete="username" />
        </div>
        <div class="form-group">
          <label for="password">Mot de passe</label>
          <input type="password" id="password" name="password" required autocomplete="current-password" />
        </div>
        <button type="submit" id="submit-btn" class="btn btn-primary" style="width:100%">
          Se connecter
        </button>
        <p class="error-message" id="error-message"></p>
        <p style="text-align:center; font-size:0.85rem; margin-top:16px;">
          Pas encore de compte ? <a class="link-plain" href="signup.html">Créer un compte</a>
        </p>
      </form>
    </div>
  </div>

  <script type="module">
    import { login } from "./js/auth.js";
    import { supabase } from "./js/supabaseClient.js";

    // Si déjà connecté, redirection directe vers le dashboard.
    const { data: { session } } = await supabase.auth.getSession();
    if (session) window.location.href = "dashboard.html";

    const form = document.getElementById("login-form");
    const errorEl = document.getElementById("error-message");
    const submitBtn = document.getElementById("submit-btn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorEl.textContent = "";
      submitBtn.disabled = true;
      submitBtn.textContent = "Connexion...";

      const email = form.email.value.trim();
      const password = form.password.value;

      try {
        await login(email, password);
        window.location.href = "dashboard.html";
      } catch (err) {
        errorEl.textContent = err.message;
        submitBtn.disabled = false;
        submitBtn.textContent = "Se connecter";
      }
    });
  </script>
</body>
</html>
