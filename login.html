<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connexion — TailorFlow</title>
  <meta name="description" content="TailorFlow — la gestion d'atelier de couture : clients, mesures, commandes, facturation." />
  <meta name="theme-color" content="#234867" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.2"></script>
</head>
<body>
  <main class="login-page">
    <div class="login-card">
      <div class="auth-brand"><img src="favicon.svg" alt="" width="36" height="36" /> TailorFlow</div>
      <h1>Connexion</h1>
      <p class="subtitle">Accède à ton atelier ou à ton espace client.</p>

      <form id="login-form">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required autocomplete="username" inputmode="email" />
        </div>
        <div class="form-group">
          <label for="password">Mot de passe</label>
          <input type="password" id="password" name="password" required autocomplete="current-password" />
        </div>
        <button type="submit" id="submit-btn" class="btn btn-primary btn-block">Se connecter</button>
        <p class="error-message" id="error-message" role="alert"></p>
      </form>
      <p class="auth-footer"><a class="link-plain" href="forgot-password.html">Mot de passe oublié ?</a></p>
      <p class="auth-footer">Pas encore de compte ? <a class="link-plain" href="signup.html">Créer un compte</a></p>
      <p class="auth-footer text-sm">Tu as reçu un code de ton couturier ? <a class="link-plain" href="client-signup.html">Activer mon espace client</a></p>
    </div>
  </main>

  <script type="module" src="js/loginPage.js"></script>
</body>
</html>
