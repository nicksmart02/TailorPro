<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Types de vêtements — TailorFlow</title>
  <meta name="theme-color" content="#234867" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.2"></script>
</head>
<body>
  <div class="app-shell">
    <nav class="app-nav" id="app-nav" aria-label="Navigation principale"></nav>

    <main class="app-main">
      <div class="page-header">
        <div>
          <h1>Types de vêtements</h1>
          <p class="text-muted">Chaque type définit les champs proposés lors de la prise de mesure. Ta liste t'est propre.</p>
        </div>
        <div class="page-header-actions">
          <button class="btn btn-primary" id="new-type-btn" type="button">+ Nouveau type</button>
        </div>
      </div>

      <div class="card card-flush">
        <table class="data-table">
          <thead>
            <tr><th>Type</th><th>Champs de mesure</th><th></th></tr>
          </thead>
          <tbody id="garment-types-table-body"></tbody>
        </table>
      </div>
    </main>
  </div>

  <!-- Modale : type de vêtement -->
  <div class="modal-backdrop" id="type-modal" role="dialog" aria-modal="true" aria-labelledby="type-modal-title" aria-hidden="true">
    <div class="modal-box modal-wide">
      <div class="modal-header">
        <h2 id="type-modal-title">Nouveau type de vêtement</h2>
        <button class="modal-close" id="close-type-modal" type="button" aria-label="Fermer">&times;</button>
      </div>
      <form id="type-form">
        <div class="form-group">
          <label for="type-label">Nom du type *</label>
          <input type="text" id="type-label" name="label" required maxlength="100" placeholder="Ex : Boubou, Tailleur, Uniforme..." />
        </div>

        <p class="form-label">Champs de mesure *</p>
        <div id="fields-rows"></div>
        <button type="button" class="btn btn-secondary btn-sm" id="add-field-row-btn">+ Ajouter un champ</button>
        <p class="field-hint" style="margin-top:8px;">Modifier un libellé ne change pas les mesures déjà prises ; elles gardent leurs valeurs.</p>

        <p class="error-message" id="type-form-error" role="alert"></p>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" id="cancel-type-form">Annuler</button>
          <button type="submit" class="btn btn-primary">Enregistrer</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="js/garmentTypes.js"></script>
</body>
</html>
