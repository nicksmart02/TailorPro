<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Détail commande — TailorFlow</title>
  <meta name="theme-color" content="#234867" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.2"></script>
</head>
<body>
  <div class="app-shell">
    <nav class="app-nav" id="app-nav" aria-label="Navigation principale"></nav>

    <main class="app-main">
      <p><a class="link-plain" href="orders.html">&larr; Retour aux commandes</a></p>

      <div class="page-header">
        <div>
          <h1 id="order-title">—</h1>
          <div id="order-status-badge"></div>
        </div>
        <div class="page-header-actions">
          <button class="btn btn-secondary" id="edit-order-btn" type="button">Modifier</button>
          <button class="btn btn-danger-outline" id="delete-order-btn" type="button" style="display:none;">Supprimer</button>
        </div>
      </div>

      <div class="card" id="status-actions-card">
        <h2 class="card-title">Avancement</h2>
        <ol class="status-steps" id="status-steps"></ol>
        <div class="button-row" id="status-actions"></div>
      </div>

      <div class="card">
        <h2 class="card-title">Facturation</h2>
        <div id="invoice-section"></div>
      </div>

      <div class="two-col-grid">
        <div class="card">
          <h2 class="card-title">Détails</h2>
          <dl class="kv-list" id="order-info"></dl>
        </div>
        <div class="card">
          <h2 class="card-title">Fiche de mesure utilisée</h2>
          <dl class="kv-list kv-list-compact" id="order-measurement-info"></dl>
        </div>
      </div>
    </main>
  </div>

  <!-- Modale : modifier la commande -->
  <div class="modal-backdrop" id="edit-modal" role="dialog" aria-modal="true" aria-labelledby="edit-modal-title" aria-hidden="true">
    <div class="modal-box modal-wide">
      <div class="modal-header">
        <h2 id="edit-modal-title">Modifier la commande</h2>
        <button class="modal-close" id="close-edit-modal" type="button" aria-label="Fermer">&times;</button>
      </div>
      <form id="edit-form">
        <div class="form-group">
          <label for="edit-description">Description *</label>
          <input type="text" id="edit-description" name="garment_description" required maxlength="200" />
        </div>
        <div class="form-group">
          <label for="edit-measurement">Fiche de mesure *</label>
          <select id="edit-measurement" name="measurement_id" required></select>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="edit-fabric">Tissu / précisions</label>
            <input type="text" id="edit-fabric" name="fabric" maxlength="100" />
          </div>
          <div class="form-group">
            <label for="edit-due-date">Date de remise *</label>
            <input type="date" id="edit-due-date" name="due_date" required />
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="edit-quantity">Quantité *</label>
            <input type="number" id="edit-quantity" name="quantity" min="1" step="1" required />
          </div>
          <div class="form-group">
            <label for="edit-unit-price">Prix unitaire (FCFA) *</label>
            <input type="number" id="edit-unit-price" name="unit_price" min="0" step="1" required />
          </div>
        </div>
        <p class="field-hint" id="edit-paid-hint"></p>
        <p class="error-message" id="edit-form-error" role="alert"></p>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" id="cancel-edit-form">Annuler</button>
          <button type="submit" class="btn btn-primary">Enregistrer</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="js/orderDetail.js"></script>
</body>
</html>
