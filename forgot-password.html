<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mot de passe oublié — TailorFlow</title>
  <meta name="description" content="TailorFlow — la gestion d'atelier de couture : clients, mesures, commandes, facturation." />
  <meta name="theme-color" content="#234867" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.2"></script>
</head>
<body>
  <main class="login-page">
    <div class="login-card">
      <div class="auth-brand"><img src="favicon.svg" alt="" width="36" height="36" /> TailorFlow</div>
      <h1>Mot de passe oublié</h1>
      <p class="subtitle">Entre ton email : on t'envoie un lien pour choisir un nouveau mot de passe.</p>

      <form id="forgot-form">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required autocomplete="username" inputmode="email" />
        </div>
        <button type="submit" id="submit-btn" class="btn btn-primary btn-block">Envoyer le lien</button>
        <p class="error-message" id="error-message" role="alert"></p>
        <p class="banner banner-success" id="success-message" role="status" hidden></p>
      </form>
      <p class="auth-footer"><a class="link-plain" href="login.html">&larr; Retour à la connexion</a></p>
    </div>
  </main>

  <script type="module" src="js/forgotPasswordPage.js"></script>
</body>
</html>
