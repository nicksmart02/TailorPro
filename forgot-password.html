<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mot de passe oublié — TailorFlow</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <h1>Mot de passe oublié</h1>
      <p class="subtitle">Entre ton email, on t'envoie un lien pour réinitialiser ton mot de passe.</p>

      <form id="forgot-form">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required autocomplete="username" />
        </div>
        <button type="submit" id="submit-btn" class="btn btn-primary" style="width:100%">
          Envoyer le lien
        </button>
        <p class="error-message" id="error-message"></p>
        <p class="success-message" id="success-message" style="display:none; color:var(--color-success); font-size:0.85rem; margin-top:12px;"></p>
        <p style="text-align:center; font-size:0.85rem; margin-top:16px;">
          <a class="link-plain" href="login.html">&larr; Retour à la connexion</a>
        </p>
      </form>
    </div>
  </div>

  <script type="module">
    import { requestPasswordReset } from "./js/auth.js";

    const form = document.getElementById("forgot-form");
    const errorEl = document.getElementById("error-message");
    const successEl = document.getElementById("success-message");
    const submitBtn = document.getElementById("submit-btn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorEl.textContent = "";
      successEl.style.display = "none";
      submitBtn.disabled = true;
      submitBtn.textContent = "Envoi...";

      const email = form.email.value.trim();

      try {
        await requestPasswordReset(email);
        successEl.textContent = "Si un compte existe avec cet email, un lien de réinitialisation vient d'être envoyé. Vérifie ta boîte mail (et les spams).";
        successEl.style.display = "block";
        form.querySelector("input[type=email]").disabled = true;
        submitBtn.style.display = "none";
      } catch (err) {
        errorEl.textContent = err.message;
        submitBtn.disabled = false;
        submitBtn.textContent = "Envoyer le lien";
      }
    });
  </script>
</body>
</html>
