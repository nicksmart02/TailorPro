<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nouveau mot de passe — TailorFlow</title>
  <meta name="description" content="TailorFlow — la gestion d'atelier de couture : clients, mesures, commandes, facturation." />
  <meta name="theme-color" content="#234867" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.2"></script>
</head>
<body>
  <main class="login-page">
    <div class="login-card">
      <div class="auth-brand"><img src="favicon.svg" alt="" width="36" height="36" /> TailorFlow</div>
      <h1>Nouveau mot de passe</h1>
      <p class="subtitle" id="subtitle">Choisis un nouveau mot de passe pour ton compte.</p>

      <form id="reset-form">
        <div class="form-group">
          <label for="password">Nouveau mot de passe (8 caractères minimum)</label>
          <input type="password" id="password" name="password" required minlength="8" autocomplete="new-password" />
        </div>
        <div class="form-group">
          <label for="password_confirm">Confirmer le mot de passe</label>
          <input type="password" id="password_confirm" name="password_confirm" required minlength="8" autocomplete="new-password" />
        </div>
        <button type="submit" id="submit-btn" class="btn btn-primary btn-block">Enregistrer</button>
        <p class="error-message" id="error-message" role="alert"></p>
      </form>
    </div>
  </main>

  <script type="module" src="js/resetPasswordPage.js"></script>
</body>
</html>
