<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nouveau mot de passe — TailorFlow</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <h1>Nouveau mot de passe</h1>
      <p class="subtitle" id="subtitle">Choisis un nouveau mot de passe pour ton compte.</p>

      <form id="reset-form">
        <div class="form-group">
          <label for="password">Nouveau mot de passe (8 caractères minimum)</label>
          <input type="password" id="password" name="password" required minlength="8" autocomplete="new-password" />
        </div>
        <div class="form-group">
          <label for="password_confirm">Confirmer le mot de passe</label>
          <input type="password" id="password_confirm" name="password_confirm" required minlength="8" autocomplete="new-password" />
        </div>
        <button type="submit" id="submit-btn" class="btn btn-primary" style="width:100%">
          Enregistrer
        </button>
        <p class="error-message" id="error-message"></p>
      </form>
    </div>
  </div>

  <script type="module">
    import { updatePassword, fetchCurrentProfile } from "./js/auth.js";
    import { supabase } from "./js/supabaseClient.js";

    const form = document.getElementById("reset-form");
    const errorEl = document.getElementById("error-message");
    const subtitleEl = document.getElementById("subtitle");
    const submitBtn = document.getElementById("submit-btn");

    // Le lien reçu par email établit automatiquement une session "recovery" via
    // Supabase (lecture du hash d'URL). On vérifie juste qu'une session existe.
    const { data: { session } } = await supabase.auth.getSession();
    if (!session) {
      subtitleEl.textContent = "";
      form.innerHTML = `<p class="error-message">Ce lien n'est plus valide ou a expiré. Redemande un lien depuis la page "Mot de passe oublié".</p>
        <p style="text-align:center; margin-top:12px;"><a class="link-plain" href="forgot-password.html">Redemander un lien</a></p>`;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorEl.textContent = "";

      if (form.password.value !== form.password_confirm.value) {
        errorEl.textContent = "Les deux mots de passe ne correspondent pas.";
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "Enregistrement...";

      try {
        await updatePassword(form.password.value);
        const profile = await fetchCurrentProfile().catch(() => null);
        window.location.href = profile?.role === "client" ? "client-portal.html" : "dashboard.html";
      } catch (err) {
        errorEl.textContent = err.message;
        submitBtn.disabled = false;
        submitBtn.textContent = "Enregistrer";
      }
    });
  </script>
</body>
</html>
